<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,
initial-scale=1.0">
  <title>Video Upload & Download</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10121c;
      color: white;
      padding: 30px 16px;
    }

    .container {
      max-width: 850px;
      margin: auto;
    }

    h1 { text-align: center; }
    .subtitle {
      color: #aeb2c2;
      text-align: center;
    }

    .panel {
      background: #1c2030;
      padding: 25px;
      margin-top: 25px;
      border-radius: 14px;
    }

    .upload-area {
      border: 2px dashed #777e9a;
      padding: 35px 15px;
      text-align: center;
      border-radius: 12px;
      cursor: pointer;
    }

    .upload-area:hover {
      border-color: #ff4775;
    }

    input[type="file"] { display: none; }

    button, .button {
      border: none;
      background: #ff386b;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      text-decoration: none;
      display: inline-block;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    video {
      width: 100%;
      background: black;
      border-radius: 10px;
      margin-top: 15px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
    }

    .info {
      color: #bfc3d1;
      overflow-wrap: anywhere;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <h1>🎬 Video Studio</h1>
  <p class="subtitle">動画をアップロードして再生・保存</p>

  <div class="panel">
    <h2>動画ファイルを選択</h2>

    <div class="upload-area" id="dropArea">
      <p>📁 クリックしてファイルを選択（PDF や TXT は許さない）</p>
      <p>または動画をドラッグ＆ドロップ</p>
      <p class="info">MP4 / MOV / AVI / WEBM など</p>
    </div>

    <input type="file" id="uploadFile"
accept="video/*,.avi,.mov,.mp4,.webm,mv"
onchange="handleFileSelect(event)">
  </div>

  <div class="panel hidden" id="previewPanel">
    <h2>動画プレビュー</h2>
    <p class="info" id="fileInfo"></p>

    <video id="videoPlayer" controls></video>

    <div class="buttons">
      <button id="playBtn">▶ 再生</button>
      <button id="pauseBtn">⏸ 一時停止</button>
      <button id="downloadBtn">⬇ ダウンロード</button>
    </div>
  </div>
</div>

<script>

  const fileInput = document.getElementById("uploadFile");
  const videoPlayer = document.getElementById("videoPlayer");
  const fileInfo = document.getElementById("fileInfo");

  let currentFile = null;
  let downloadUrl = "";
  let isDragging = false;

    uploadFile.click();
  });

  fileInput.addEventListener("change", () => {
    if (fileInput.files.length > 0) {
      loadVideo(fileInput.files[0]);
    }
  });
